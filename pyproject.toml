[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-data-analyzer"
version = "0.1.0"
description = "Ingests OpenSky ADS-B state vectors around Atlantic City International Airport (ACY) into PostgreSQL and analyzes them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
fda-ingest = "fda.ingest:main"
fda-analyze = "fda.analyze:main"
fda-health = "fda.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fda = ["sql/*.sql", "sql/analyses/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
